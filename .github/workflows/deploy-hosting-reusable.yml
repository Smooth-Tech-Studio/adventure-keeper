name: Deploy Firebase Hosting

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment holding the Firebase secrets (production or staging)
        type: string
        default: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Optional: without it, the Dropbox image import does not show.
          VITE_DROPBOX_APP_KEY: ${{ secrets.VITE_DROPBOX_APP_KEY }}
          # The staging site offers the staging server app (pre-release `serveur-staging`).
          VITE_DESKTOP_RELEASE_TAG: ${{ inputs.environment == 'staging' && 'serveur-staging' || '' }}

      # An environment without its own secrets silently falls back to the
      # repository-level ones, which are production's: never let staging
      # deploy there.
      - name: Refuse staging on the production project
        if: ${{ inputs.environment == 'staging' }}
        env:
          PID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$PID" ] || [ "$PID" = "adv-keeper" ]; then
            echo "::error::The staging environment has no VITE_FIREBASE_PROJECT_ID of its own (or it is the production project)"
            exit 1
          fi

      - name: Check deploy secrets
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          echo "FIREBASE_SERVICE_ACCOUNT length: ${#SA}"
          echo "VITE_FIREBASE_PROJECT_ID length: ${#PID}"
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is empty or missing (check name / Repository-Actions scope)"
            exit 1
          fi
          case "$SA" in
            \{*) echo "service account value looks like JSON (starts with '{'): OK" ;;
            *) echo "::warning::service account value does NOT start with '{' — likely truncated or wrong content" ;;
          esac
          printf '%s' "$SA" | grep -q '"private_key"' \
            && echo 'service account contains a "private_key" field: OK' \
            || echo '::warning::no "private_key" field found in the secret'

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
