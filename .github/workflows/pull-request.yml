name: "Pull request: CI"

on:
  pull_request:
    # Paused for `staging`: add it back to check the PRs that target it.
    branches: [main]
    # No paths-ignore: `ci / build` is a required check on `main`, and a PR it
    # skips (docs only) would wait for it forever.

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    secrets: inherit

  # The whole app end to end before the merge: `e2e / e2e` is a required check
  # on `main`. Own Firebase emulators, no secret, so it runs on a fork's PR too
  # (once a maintainer approves its first run).
  e2e:
    uses: ./.github/workflows/e2e-reusable.yml
    concurrency:
      group: e2e-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
