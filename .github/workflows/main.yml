name: "main: CI, CD (production)"

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

jobs:
  # Was this push a pull request already tested as it now stands on
  # `main`? Its last commit must have passed `ci / build` and `e2e / e2e` (the
  # checks the `main` ruleset requires), and `main` must now hold exactly
  # that commit's files (same tree): nothing came from `main` that the tests
  # did not see. Then nothing is run twice; otherwise — an admin merge that
  # did not wait, a branch that was behind, a manual run — the CI and the
  # end-to-end tests run here before anything is deployed. (Comparing the
  # files rather than the commits accepts the merge commits that `main` gets
  # from `staging` and `staging` never receives: they change no file.)
  tested:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          verdict() { echo "ok=$1" >> "$GITHUB_OUTPUT"; echo "$2"; exit 0; }

          head=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].head.sha // ""')
          [ -n "$head" ] || verdict false "No merged pull request for $SHA: testing here."

          tree() { gh api "repos/$REPO/git/commits/$1" --jq '.tree.sha'; }
          [ "$(tree "$SHA")" = "$(tree "$head")" ] \
            || verdict false "main now differs from the tested ${head::7} (it held changes the branch lacked): testing here."

          for name in "ci / build" "e2e / e2e"; do
            conclusion=$(gh api -X GET "repos/$REPO/commits/$head/check-runs" -f check_name="$name" \
              --jq '[.check_runs[]] | sort_by(.completed_at) | last | .conclusion // ""')
            [ "$conclusion" = success ] || verdict false "« $name » is « ${conclusion:-missing} » on ${head::7}: testing here."
          done
          verdict true "Pull request tested on ${head::7}, same files on main: deploying without testing again."

  ci:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.ok != 'true' }}
    uses: ./.github/workflows/ci-reusable.yml
    secrets: inherit
    concurrency:
      group: ci-main-${{ github.ref }}
      cancel-in-progress: true

  e2e:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.ok != 'true' }}
    uses: ./.github/workflows/e2e-reusable.yml
    concurrency:
      group: e2e-main-${{ github.ref }}
      cancel-in-progress: true

  # What the push touches, to skip the deployments it cannot affect.
  changes:
    runs-on: ubuntu-latest
    outputs:
      firestore: ${{ steps.filter.outputs.firestore }}
      serveur: ${{ steps.filter.outputs.serveur }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect what changed
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "firestore=true" >> "$GITHUB_OUTPUT"
            echo "serveur=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only "$BEFORE" "$AFTER")
          firestore=false
          serveur=false
          grep -Eq '^(firestore\.rules|firestore\.indexes\.json|firebase\.json|\.github/workflows/deploy-firestore-reusable\.yml)$' <<< "$files" && firestore=true
          grep -Eq '^(apps/realtime-desktop/|apps/realtime-server/|packages/schemas/|\.github/workflows/release-serveur-reusable\.yml$)' <<< "$files" && serveur=true
          echo "firestore=$firestore" >> "$GITHUB_OUTPUT"
          echo "serveur=$serveur" >> "$GITHUB_OUTPUT"

  deploy-firestore:
    needs: [tested, ci, e2e, changes]
    if: ${{ !cancelled() && (needs.tested.outputs.ok == 'true' || (needs.ci.result == 'success' && needs.e2e.result == 'success')) && needs.changes.outputs.firestore == 'true' }}
    concurrency:
      group: firebase-firestore-rules
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-firestore-reusable.yml
    with:
      environment: production
    secrets: inherit

  deploy-hosting:
    needs: [tested, ci, e2e]
    if: ${{ !cancelled() && (needs.tested.outputs.ok == 'true' || (needs.ci.result == 'success' && needs.e2e.result == 'success')) }}
    concurrency:
      group: firebase-hosting-live
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-hosting-reusable.yml
    with:
      environment: production
    secrets: inherit

  # The desktop server app: built on four systems and published as a release
  # (see release-serveur-reusable.yml), only when the push touches it. One
  # run at a time, never cancelled: each computes the next version.
  serveur:
    needs: [tested, ci, e2e, changes]
    if: ${{ !cancelled() && (needs.tested.outputs.ok == 'true' || (needs.ci.result == 'success' && needs.e2e.result == 'success')) && needs.changes.outputs.serveur == 'true' }}
    concurrency:
      group: serveur-production
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-serveur-reusable.yml
    with:
      channel: production
    secrets: inherit
