name: "staging: CI, CD (staging)"

on:
  push:
    branches: [staging]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch: {}

jobs:
  # Was this push a pull request already tested as it now stands on
  # `staging`? Its last commit must have passed `ci / build` and `e2e / e2e`
  # (the checks the `staging` ruleset requires), and its branch must have held
  # the previous `staging` (up to date). Then nothing is run twice; otherwise
  # — an admin merge that did not wait, a manual run — the CI and the
  # end-to-end tests run here before anything is deployed.
  tested:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          verdict() { echo "ok=$1" >> "$GITHUB_OUTPUT"; echo "$2"; exit 0; }

          # A manual run has no `before`: test it.
          [ -n "$BEFORE" ] || verdict false "Manual run: testing here."

          head=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "staging")][0].head.sha // ""')
          [ -n "$head" ] || verdict false "No merged pull request for $SHA: testing here."

          behind=$(gh api "repos/$REPO/compare/$BEFORE...$head" --jq '.behind_by')
          [ "$behind" = 0 ] || verdict false "The branch was $behind commit(s) behind staging: testing here."

          for name in "ci / build" "e2e / e2e"; do
            conclusion=$(gh api -X GET "repos/$REPO/commits/$head/check-runs" -f check_name="$name" \
              --jq '[.check_runs[]] | sort_by(.completed_at) | last | .conclusion // ""')
            [ "$conclusion" = success ] || verdict false "« $name » is « ${conclusion:-missing} » on ${head::7}: testing here."
          done
          verdict true "Pull request tested on ${head::7}, up to date with staging: deploying without testing again."

  ci:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.ok != 'true' }}
    uses: ./.github/workflows/ci-reusable.yml
    secrets: inherit
    concurrency:
      group: ci-staging-${{ github.ref }}
      cancel-in-progress: true

  e2e:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.ok != 'true' }}
    uses: ./.github/workflows/e2e-reusable.yml
    concurrency:
      group: e2e-staging-${{ github.ref }}
      cancel-in-progress: true

  changes:
    runs-on: ubuntu-latest
    outputs:
      serveur: ${{ steps.filter.outputs.serveur }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect server app changes
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          # No `before` on a manual run, all zeros on a new branch: build it.
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "serveur=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BEFORE" "$AFTER" | grep -Eq '^(apps/realtime-desktop/|apps/realtime-server/|packages/schemas/|\.github/workflows/release-serveur-reusable\.yml$)'; then
            echo "serveur=true" >> "$GITHUB_OUTPUT"
          else
            echo "serveur=false" >> "$GITHUB_OUTPUT"
          fi

  # The staging project gets its rules at every deployment, then its site.
  deploy-firestore:
    needs: [tested, ci, e2e]
    if: ${{ !cancelled() && (needs.tested.outputs.ok == 'true' || (needs.ci.result == 'success' && needs.e2e.result == 'success')) }}
    concurrency:
      group: firebase-firestore-rules-staging
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-firestore-reusable.yml
    with:
      environment: staging
    secrets: inherit

  # An explicit condition: the implicit `success()` would look at the whole
  # chain of needs, and `ci` and `e2e` are skipped when the pull request was
  # already tested.
  deploy-hosting:
    needs: [deploy-firestore]
    if: ${{ !cancelled() && needs.deploy-firestore.result == 'success' }}
    concurrency:
      group: firebase-hosting-staging
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-hosting-reusable.yml
    with:
      environment: staging
    secrets: inherit

  # The staging variant of the desktop server app, published to the
  # `serveur-staging` pre-release (see release-serveur-reusable.yml).
  serveur:
    needs: [tested, ci, e2e, changes]
    if: ${{ !cancelled() && (needs.tested.outputs.ok == 'true' || (needs.ci.result == 'success' && needs.e2e.result == 'success')) && needs.changes.outputs.serveur == 'true' }}
    concurrency:
      group: serveur-staging
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-serveur-reusable.yml
    with:
      channel: staging
    secrets: inherit
